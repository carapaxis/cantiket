<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Germ</title>
  <style>
    :root {
      --ink: #143024;
      --btn: #1f8f5f;
      --btn-hover: #19734d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      color: var(--ink);
      background: hsl(150, 70%, 88%);
      overflow: hidden;
      transition: background-color 180ms linear;
    }

    .stage {
      width: min(92vw, 900px);
      display: grid;
      justify-items: center;
      gap: 1.25rem;
      padding: 1.5rem;
      z-index: 1;
      position: relative;
      overflow: visible;
    }

    body::before {
      content: "";
      position: fixed;
      width: 220vmax;
      height: 220vmax;
      top: 50%;
      left: 50%;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.85) 10px, transparent 11px);
      background-size: 52px 52px;
      opacity: 0.65;
      z-index: 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .germ-wrap {
      width: min(80vmin, 560px);
      height: min(80vmin, 560px);
      display: grid;
      place-items: center;
      perspective: 1200px;
      position: relative;
    }

    .germ-label {
      position: absolute;
      top: 20%;
      left: 33.333%;
      transform: rotate(-15deg);
      transform-origin: center;
      font-size: clamp(2.8rem, 6.8vw, 5.2rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #ff2290;
      font-family: "Brush Script MT", "Lucida Handwriting", "Segoe Script", cursive;
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.85));
      animation: labelFloat 1.8s ease-in-out infinite;
      white-space: nowrap;
      max-width: 82%;
      text-align: center;
      line-height: 0.9;
      overflow-wrap: anywhere;
      pointer-events: none;
      z-index: 2;
    }

    .germ {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center;
      filter: drop-shadow(-12px 12px 0 rgba(16, 44, 31, 0.5));
      animation: floatBounce 1.8s ease-in-out infinite;
      transition: filter 220ms ease;
      will-change: transform;
      cursor: pointer;
      transform-style: preserve-3d;
      backface-visibility: visible;
    }

    .germ:hover {
      animation: hoverAlive 1.1s ease-in-out infinite;
      filter: drop-shadow(-14px 16px 0 rgba(13, 36, 25, 0.3)) saturate(1.1);
    }

    .germ.selected {
      animation: selectionCelebrate 0.9s linear 1 !important;
      transition: none;
    }

    .randomize {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      border: 0;
      padding: 0.2rem 0.4rem;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f93cd9;
      background: transparent;
      cursor: pointer;
      font-family: "Cooper Black", "Arial Rounded MT Bold", "Comic Sans MS", cursive;
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.85));
      animation: buttonPulse 1.8s ease-in-out infinite;
      transition: transform 160ms ease, filter 180ms ease;
      z-index: 3;
      white-space: nowrap;
      text-align: center;
      line-height: 1;
    }

    .randomize:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.8));
    }

    .randomize:active {
      transform: scale(0.96);
    }

    .show-all {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      border: 0;
      padding: 0.15rem 0.35rem;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f93cd9;
      background: transparent;
      cursor: pointer;
      font-family: "Cooper Black", "Arial Rounded MT Bold", "Comic Sans MS", cursive;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.85));
      animation: buttonPulse 1.8s ease-in-out infinite;
      transition: transform 160ms ease, filter 180ms ease;
      text-decoration: none;
      z-index: 5;
    }

    .show-all:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.8));
    }

    .show-all:active {
      transform: scale(0.96);
    }

    @keyframes floatBounce {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-22px) scale(1.01);
      }
    }

    @keyframes hoverAlive {
      0%,
      100% {
        transform: translateY(0) scale(1.04) rotateZ(-2deg);
      }
      25% {
        transform: translateY(-14px) scale(1.07) rotateZ(2deg);
      }
      50% {
        transform: translateY(-22px) scale(1.08) rotateZ(-1deg);
      }
      75% {
        transform: translateY(-12px) scale(1.06) rotateZ(2deg);
      }
    }

    @keyframes buttonPulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.14);
      }
    }

    @keyframes selectionCelebrate {
      0% {
        transform: translateY(0) rotateX(0deg) scale(1);
      }
      20% {
        transform: translateY(-30px) rotateX(72deg) scale(1.07);
      }
      40% {
        transform: translateY(-18px) rotateX(144deg) scale(1.03);
      }
      60% {
        transform: translateY(-28px) rotateX(216deg) scale(1.05);
      }
      80% {
        transform: translateY(-10px) rotateX(288deg) scale(1.02);
      }
      100% {
        transform: translateY(0) rotateX(360deg) scale(1);
      }
    }

    @keyframes labelFloat {
      0%,
      100% {
        transform: rotate(-15deg) scale(1);
      }
      50% {
        transform: rotate(-15deg) scale(1.1);
      }
    }

    @media (max-width: 640px) {
      .stage {
        width: 100vw;
        padding: 1rem 0.75rem 1.4rem;
      }

      .germ-label {
        top: 14%;
        font-size: clamp(2rem, 11vw, 3.2rem);
        max-width: 86%;
      }

      .randomize {
        bottom: 0.2rem;
        font-size: clamp(1.5rem, 9vw, 2.5rem);
        max-width: 90%;
      }
    }

  </style>
</head>
<body>
  <main class="stage">
    <a class="show-all" href="grid.html">SHOW ALL</a>
    <div class="germ-wrap">
      <div id="germLabel" class="germ-label"></div>
      <img id="germImage" class="germ" src="" alt="Random germ image" />
      <button id="randomBtn" class="randomize" type="button">RANDOMIZE</button>
    </div>
  </main>

  <script>
    const images = [
      "germs/germ_aji.png",
      "germs/germ_alexandria.png",
      "germs/germ_almond.png",
      "germs/germ_aoko.png",
      "germs/germ_axel.png",
      "germs/germ_bird.png",
      "germs/germ_brigitte.png",
      "germs/germ_camille.png",
      "germs/germ_carina.png",
      "germs/germ_chanwook.png",
      "germs/germ_chenyi.png",
      "germs/germ_cheryl.png",
      "germs/germ_cillian.png",
      "germs/germ_clove.png",
      "germs/germ_daniel.png",
      "germs/germ_diablo.png",
      "germs/germ_dion.png",
      "germs/germ_dolana.png",
      "germs/germ_five.png",
      "germs/germ_frankie.png",
      "germs/germ_giles.png",
      "germs/germ_goldie.png",
      "germs/germ_guy.png",
      "germs/germ_haitao.png",
      "germs/germ_hanya.png",
      "germs/germ_havi.png",
      "germs/germ_hoying.png",
      "germs/germ_huizhong.png",
      "germs/germ_isa.png",
      "germs/germ_jett.png",
      "germs/germ_jj.png",
      "germs/germ_joan.png",
      "germs/germ_johannes.png",
      "germs/germ_john.png",
      "germs/germ_jolene.png",
      "germs/germ_kc.png",
      "germs/germ_kelly.png",
      "germs/germ_kipper.png",
      "germs/germ_kira.png",
      "germs/germ_lala.png",
      "germs/germ_leo.png",
      "germs/germ_luther.png",
      "germs/germ_mari.png",
      "germs/germ_miki.png",
      "germs/germ_mikio.png",
      "germs/germ_nama.png",
      "germs/germ_pacifica.png",
      "germs/germ_phi.png",
      "germs/germ_ren.png",
      "germs/germ_sam.png",
      "germs/germ_samantha.png",
      "germs/germ_saul.png",
      "germs/germ_savannah.png",
      "germs/germ_seulki.png",
      "germs/germ_shu hua.png",
      "germs/germ_sidney.png",
      "germs/germ_sloane.png",
      "germs/germ_somsak.png",
      "germs/germ_songyi.png",
      "germs/germ_spencer.png",
      "germs/germ_tetsuo.png",
      "germs/germ_tutu.png",
      "germs/germ_vasily.png",
      "germs/germ_venom.png",
      "germs/germ_zachary.png"
    ];

    const germImage = document.getElementById("germImage");
    const germLabel = document.getElementById("germLabel");
    const randomBtn = document.getElementById("randomBtn");
    const ROLLED_STORAGE_KEY = "rolledGerms";

    let currentIndex = -1;
    let isRolling = false;

    function getNextRandomIndex() {
      if (images.length <= 1) return 0;

      let nextIndex = currentIndex;
      while (nextIndex === currentIndex) {
        nextIndex = Math.floor(Math.random() * images.length);
      }
      return nextIndex;
    }

    function showRandomImage() {
      const nextIndex = getNextRandomIndex();
      showImageAtIndex(nextIndex);
    }

    function showImageAtIndex(index) {
      currentIndex = index;
      germImage.src = images[currentIndex];
      germImage.alt = `Random germ image ${currentIndex + 1}`;
      const fileName = images[currentIndex].split("/").pop().replace(/^germ_/, "").replace(/\.[^.]+$/, "");
      germLabel.textContent = fileName;
      germLabel.style.color = getRandomBrightColor();
    }

    function getRandomBrightColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 95%, 60%)`;
    }

    function getRolledSet() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ROLLED_STORAGE_KEY) || "[]");
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch {
        return new Set();
      }
    }

    function saveRolledSet(rolledSet) {
      localStorage.setItem(ROLLED_STORAGE_KEY, JSON.stringify([...rolledSet]));
    }

    function markCurrentGermAsRolled() {
      if (currentIndex < 0) return;
      const rolledSet = getRolledSet();
      rolledSet.add(images[currentIndex]);
      saveRolledSet(rolledSet);
    }

    function playSelectionAnimation() {
      germImage.classList.remove("selected");
      void germImage.offsetWidth;
      germImage.classList.add("selected");
    }

    germImage.addEventListener("animationend", (event) => {
      if (event.animationName === "selectionCelebrate") {
        germImage.classList.remove("selected");
      }
    });

    function getRandomIndexExcept(excludeIndex) {
      if (images.length <= 1) return 0;
      let index = excludeIndex;
      while (index === excludeIndex) {
        index = Math.floor(Math.random() * images.length);
      }
      return index;
    }

    async function runLotteryRoll() {
      if (isRolling) return;
      isRolling = true;
      randomBtn.disabled = true;
      randomBtn.textContent = "...";

      let shownIndex = currentIndex >= 0 ? currentIndex : 0;
      const steps = 18;

      for (let step = 0; step < steps; step++) {
        shownIndex = getRandomIndexExcept(shownIndex);
        showImageAtIndex(shownIndex);

        const delay = 60 + step * 22;
        await new Promise((resolve) => setTimeout(resolve, delay));
      }

      const finalIndex = getRandomIndexExcept(currentIndex);
      showImageAtIndex(finalIndex);
      markCurrentGermAsRolled();
      playSelectionAnimation();

      randomBtn.textContent = "RANDOMIZE";
      randomBtn.disabled = false;
      isRolling = false;
    }

    function getRandomPastelColor() {
      const hue = Math.floor(Math.random() * 360);
      const saturation = 65 + Math.floor(Math.random() * 15);
      const lightness = 84 + Math.floor(Math.random() * 8);
      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    randomBtn.addEventListener("click", runLotteryRoll);

    setInterval(() => {
      document.body.style.backgroundColor = getRandomPastelColor();
    }, 300);

    runLotteryRoll();
  </script>
</body>
</html>
