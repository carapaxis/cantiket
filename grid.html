<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Germs</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      background: hsl(150, 70%, 88%);
      transition: background-color 180ms linear;
      overflow-x: hidden;
      color: #143024;
    }

    body::before {
      content: "";
      position: fixed;
      width: 220vmax;
      height: 220vmax;
      top: 50%;
      left: 50%;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.85) 10px, transparent 11px);
      background-size: 52px 52px;
      opacity: 0.65;
      z-index: 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1200px, 94vw);
      margin: 2rem auto 3rem;
    }

    .back {
      position: fixed;
      top: 0.9rem;
      left: 1rem;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f93cd9;
      font-family: "Cooper Black", "Arial Rounded MT Bold", "Comic Sans MS", cursive;
      text-decoration: none;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.85));
      animation: bob 1.8s ease-in-out infinite;
      z-index: 2;
    }

    .back:hover {
      transform: scale(1.08);
    }

    h1 {
      margin: 0 0 1rem;
      text-align: center;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.04em;
      color: #ff2290;
      filter: drop-shadow(-1px 2px 1px rgba(0, 0, 0, 0.8));
      font-family: "Cooper Black", "Arial Rounded MT Bold", "Comic Sans MS", cursive;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
    }

    .card {
      position: relative;
      display: block;
      padding: 0.2rem;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      filter: drop-shadow(-1px 1px 0.5px rgba(70, 93, 82, 0.8));
    }

    .card.rolled img {
      animation: floatBounce 1.8s ease-in-out infinite;
      transition: filter 220ms ease;
      transform-origin: center;
      cursor: pointer;
    }

    .card.rolled img:hover {
      animation: hoverAlive 1.1s ease-in-out infinite;
      filter: drop-shadow(-5px 10px 1.5px rgba(41, 63, 88, 0.5)) saturate(1.1);
    }

    .card.unrolled img {
      filter: grayscale(1) saturate(0) contrast(0.65) brightness(1.08) drop-shadow(-1px 1px 0.5px rgba(16, 44, 31, 0.8));
    }

    .name {
      position: absolute;
      left: 50%;
      top: 65%;
      transform: translateX(-50%);
      width: 88%;
      text-align: center;
      font-size: clamp(1.8rem, 2.8vw, 2.2rem);
      font-weight: 700;
      word-break: break-word;
      font-family: "Brush Script MT", "Lucida Handwriting", "Segoe Script", cursive;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.75));
      pointer-events: none;
    }

    .card.rolled .name {
      animation: rolledNameFloat 1.9s ease-in-out infinite;
    }

    @keyframes rolledNameFloat {
      0%,
      100% {
        transform: translateX(-50%) translateY(0) scale(1);
      }
      50% {
        transform: translateX(-50%) translateY(-6px) scale(1);
      }
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.45);
      z-index: 20;
      padding: 1rem;
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      width: min(680px, 94vw);
      max-height: min(84vh, 920px);
      overflow: hidden;
      background: #fff;
      border-radius: 18px;
      padding: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      display: grid;
      gap: 0.8rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 0.35rem;
      right: 0.55rem;
      border: 0;
      background: transparent;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      display: grid;
      gap: 0.8rem;
      align-items: start;
      margin-top: 0.6rem;
      max-height: calc(min(84vh, 920px) - 4.2rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .modal-text {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f7f7f7;
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
    }

    .modal-signoff {
      margin: 0.2rem 0 0;
      font-size: 0.95rem;
      font-style: italic;
      opacity: 0.8;
      text-align: right;
    }

    .modal-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.7rem;
    }

    .modal-item {
      display: grid;
      justify-items: center;
      gap: 0.35rem;
      text-align: center;
    }

    .modal-germ {
      width: 100%;
      max-width: 130px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      filter: drop-shadow(-1px 1px 0.5px rgba(16, 44, 31, 0.8));
    }

    .modal-name {
      font-size: 0.9rem;
      line-height: 1.2;
      font-weight: 700;
    }

    @keyframes bob {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes floatBounce {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-22px) scale(1.01);
      }
    }

    @keyframes hoverAlive {
      0%,
      100% {
        transform: translateY(0) scale(1.04) rotateZ(-2deg);
      }
      25% {
        transform: translateY(-14px) scale(1.07) rotateZ(2deg);
      }
      50% {
        transform: translateY(-22px) scale(1.08) rotateZ(-1deg);
      }
      75% {
        transform: translateY(-12px) scale(1.06) rotateZ(2deg);
      }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">BACK</a>
  <main class="page">
    <h1>GERM GRID</h1>
    <section id="grid" class="grid"></section>
  </main>
  <div id="germModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close">x</button>
      <div class="modal-body">
        <p id="modalText" class="modal-text"></p>
        <p id="modalSignoff" class="modal-signoff"></p>
        <div id="modalGroup" class="modal-group"></div>
      </div>
    </div>
  </div>

  <script>
    const grid = document.getElementById("grid");
    const modal = document.getElementById("germModal");
    const modalClose = document.getElementById("modalClose");
    const modalText = document.getElementById("modalText");
    const modalSignoff = document.getElementById("modalSignoff");
    const modalGroup = document.getElementById("modalGroup");
    const ROLLED_STORAGE_KEY = "rolledGerms";
    const GERM_DATA_PATH = "germ_data.json";
    const MESSAGE_SIGNOFF = "COME AFTERMATH HC WITH ME ON DISC. ADD ME. I'M @carapaxis ON TWT. kisses from arte";
    let munData = [];

    function getRandomPastelColor() {
      const hue = Math.floor(Math.random() * 360);
      const saturation = 65 + Math.floor(Math.random() * 15);
      const lightness = 84 + Math.floor(Math.random() * 8);
      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function getRandomBrightColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 95%, 55%)`;
    }

    function getRolledSet() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ROLLED_STORAGE_KEY) || "[]");
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch {
        return new Set();
      }
    }

    const rolledSet = getRolledSet();

    function fileTokenToPath(fileToken) {
      return `germs/germ_${fileToken}.png`;
    }

    function buildDisplayName(fullName, fileToken) {
      const cleaned = String(fullName || "").replace(/^"(.*)"$/, "$1").trim();
      if (cleaned) return cleaned;
      return String(fileToken || "").trim();
    }

    function openModal(munObj) {
      modalText.textContent = munObj.message && munObj.message.trim()
        ? munObj.message
        : "No message yet.";
      modalSignoff.textContent = MESSAGE_SIGNOFF;
      modalGroup.innerHTML = "";

      for (const character of munObj.characters) {
        const files = Array.isArray(character.files) ? character.files : [];
        for (const fileTokenRaw of files) {
          const fileToken = String(fileTokenRaw).trim();
          if (!fileToken) continue;
          const path = fileTokenToPath(fileToken);

          const item = document.createElement("div");
          item.className = "modal-item";

          const img = document.createElement("img");
          img.className = "modal-germ";
          img.src = path;
          img.alt = buildDisplayName(character.name, fileToken);
          img.addEventListener("error", () => {
            img.style.opacity = "0.2";
          });

          const name = document.createElement("div");
          name.className = "modal-name";
          name.textContent = buildDisplayName(character.name, fileToken);

          item.appendChild(img);
          item.appendChild(name);
          modalGroup.appendChild(item);
        }
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalText.textContent = "";
      modalSignoff.textContent = "";
      modalGroup.innerHTML = "";
    }

    async function loadMunData() {
      try {
        const response = await fetch(GERM_DATA_PATH, { cache: "no-store" });
        if (!response.ok) return [];
        const data = await response.json();
        if (!data || !Array.isArray(data.muns)) return [];
        return data.muns;
      } catch {
        return [];
      }
    }

    function imageExists(path) {
      return new Promise((resolve) => {
        const probe = new Image();
        probe.onload = () => resolve(true);
        probe.onerror = () => resolve(false);
        probe.src = path;
      });
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    async function renderGrid() {
      munData = await loadMunData();
      const allEntries = [];

      for (const munObj of munData) {
        for (const character of munObj.characters || []) {
          for (const fileTokenRaw of character.files || []) {
            const fileToken = String(fileTokenRaw).trim();
            if (!fileToken) continue;
            allEntries.push({
              mun: munObj.mun,
              message: munObj.message || "",
              munObj,
              characterName: character.name,
              fileToken,
              path: fileTokenToPath(fileToken)
            });
          }
        }
      }

      for (const entry of allEntries) {
        const exists = await imageExists(entry.path);
        if (!exists) continue;

        const card = document.createElement("article");
        card.className = "card";
        const wasRolled = rolledSet.has(entry.path);
        if (wasRolled) {
          card.classList.add("rolled");
        } else {
          card.classList.add("unrolled");
        }

        const img = document.createElement("img");
        img.src = entry.path;
        img.alt = buildDisplayName(entry.characterName, entry.fileToken);
        img.addEventListener("click", () => openModal(entry.munObj));

        const name = document.createElement("div");
        name.className = "name";
        name.style.color = wasRolled ? getRandomBrightColor() : "#999";
        name.textContent = entry.fileToken;

        card.appendChild(img);
        card.appendChild(name);
        grid.appendChild(card);
      }
    }

    setInterval(() => {
      document.body.style.backgroundColor = getRandomPastelColor();
    }, 300);

    renderGrid();
  </script>
</body>
</html>
